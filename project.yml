# Generate the Xcode project with `xcodegen generate`. The .xcodeproj is committed too,
# so XcodeGen is only needed if you change targets or settings.
name: Cityflo
options:
  bundleIdPrefix: com.cityflo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Cityflo:
    type: application
    platform: iOS
    sources: [Cityflo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cityflo.search-explorer
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Cityflo Search
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
  CityfloTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CityfloTests]
    dependencies:
      - target: Cityflo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.cityflo.search-explorer.tests
schemes:
  Cityflo:
    build:
      targets:
        Cityflo: all
        CityfloTests: [test]
    test:
      targets: [CityfloTests]
    run:
      environmentVariables:
        CF_NETWORK: typical
